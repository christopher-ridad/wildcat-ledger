name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  integration:
    name: Integration
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint check
        run: |
          npx prettier --check "./**/*.{js,jsx,ts,tsx,css,md,json}"
          npx eslint src vite.config.ts --quiet

      - name: Unit & component tests
        run: |
          npx vitest run --reporter=default --reporter=github-actions \
            --reporter=json --outputFile.json=vitest-report.json

      - name: Write test summary
        if: always()
        run: |
          if [ ! -f vitest-report.json ]; then
            echo "### ⚠️ Integration: tests did not run (an earlier step failed)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          PASSED=$(jq '.numPassedTests' vitest-report.json)
          TOTAL=$(jq '.numTotalTests' vitest-report.json)
          FAILED=$(jq '.numFailedTests' vitest-report.json)
          if [ "$FAILED" = "0" ]; then
            echo "### ✅ Integration: $PASSED/$TOTAL tests passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ❌ Integration: $PASSED/$TOTAL tests passed ($FAILED failed)" >> "$GITHUB_STEP_SUMMARY"
          fi

  dev:
    name: Dev
    needs: integration
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_VISION_API_KEY: ${{ secrets.VITE_GOOGLE_VISION_API_KEY }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npx playwright test

      - name: Write e2e summary
        if: always()
        run: |
          if [ ! -f playwright-report.json ]; then
            echo "### ⚠️ Dev (e2e): tests did not run (an earlier step failed)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          EXPECTED=$(jq '.stats.expected' playwright-report.json)
          UNEXPECTED=$(jq '.stats.unexpected' playwright-report.json)
          FLAKY=$(jq '.stats.flaky' playwright-report.json)
          SKIPPED=$(jq '.stats.skipped' playwright-report.json)
          PASSED=$((EXPECTED + FLAKY))
          TOTAL=$((EXPECTED + UNEXPECTED + FLAKY + SKIPPED))
          if [ "$UNEXPECTED" = "0" ]; then
            echo "### ✅ Dev (e2e): $PASSED/$TOTAL tests passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ❌ Dev (e2e): $PASSED/$TOTAL tests passed ($UNEXPECTED failed)" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Mirrors whatever just passed onto the dev branch, so its Vercel
      # branch deployment (a stable URL, unlike the per-PR preview) always
      # reflects either the PR currently under review or, once merged,
      # main itself. Force-push because dev has no independent history of
      # its own -- it's a pointer, not a branch anyone commits to directly.
      - name: Deploy this build to the dev environment
        run: git push origin HEAD:dev --force
