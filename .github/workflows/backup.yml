name: Backup Database

on:
  schedule:
    # 06:00 UTC daily — low-traffic hours.
    - cron: '0 6 * * *'
  workflow_dispatch: {}

jobs:
  backup:
    name: Snapshot Supabase tables
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run backup
        run: node scripts/backupLedger.mjs
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: wildcat-ledger-backup-${{ github.run_id }}
          path: backups/*.json
          retention-days: 90
