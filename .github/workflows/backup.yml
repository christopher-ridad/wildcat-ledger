name: Backup Database

on:
  schedule:
    # 06:00 UTC daily — low-traffic hours.
    - cron: '0 6 * * *'
  workflow_dispatch: {}

jobs:
  backup:
    name: Snapshot Supabase tables
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run backup
        run: node scripts/backupLedger.mjs
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # This repo is public, so backups can't go through a public Actions
      # artifact (anyone could download it — see incident notes). Push the
      # snapshot into a separate private repo instead.
      - name: Checkout private backups repo
        uses: actions/checkout@v4
        with:
          repository: christopher-ridad/wildcat-ledger-backups
          token: ${{ secrets.BACKUP_REPO_TOKEN }}
          path: backups-repo

      - name: Commit and push snapshot
        run: |
          cp backups/*.json backups-repo/
          cd backups-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Backup $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
